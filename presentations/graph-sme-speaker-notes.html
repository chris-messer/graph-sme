      const NOTES = [];
      NOTES.push({
        title: 'Title',
        onscreen: 'Roadmap to Graph — name the need, map it to a semantic layer, climb with proof.',
        say: 'This is a discovery briefing, not a product tour and not an SME deep dive. Teams tell us they need a graph. What they usually need is one of three things: a hierarchy that behaves, a meaning layer their agents can read, or genuine row-level relationships. Those are taxonomy, ontology, and knowledge graph, and they map to very different work on Databricks. Today we sort your needs into those three buckets, place each one on a ladder, and leave knowing whether this stays a product conversation or becomes an SME engagement.',
        bullets: [
          ['Purpose', ['Set the sorting frame: need first, semantic layer second, technology last']],

        ],
        transition: 'Transition: "Quick map of where we\'re going."'
      });

      NOTES.push({
        title: 'Agenda',
        onscreen: 'Six beats: vocabulary, managed path and ladder, then taxonomy, ontology, knowledge graphs.',
        say: 'Six beats. Vocabulary first, and it takes one screen because the visual does the work. Then where every engagement starts and what actually justifies a climb. Then the three sections, and each one opens with a short overview before the specific client needs we keep hearing. Taxonomy runs as one argument after that — what a taxonomy is, the need, the options, and where we land. Ontology brings two needs, knowledge graphs bring five. We close on an operating rule and open discussion.',
        bullets: [
          ['Keep it moving', ['Roughly 60–75 minutes with discussion', 'Every section has at least one interactive visual — let it teach instead of narrating']],
          ['SA outcome', ['Leave with: which of the three layers each need belongs to, a starting rung, 3–5 benchmark questions, owners, and an escalate-or-not call']],
        ],
        transition: 'Transition: "First — what people usually mean when they say graph."'
      });

      NOTES.push({
        title: 'Framing',
        onscreen: 'Three metrics: two implementation families, three semantic layers, managed path first.',
        say: 'Graph databases and graph virtualization are both real categories with good vendors in them. Knowledge graphs sit beside them as a third thing — organizational understanding rendered as interconnected data. In the field, most teams turn out to want relationships their agents can use and a way to explore what connects to what, not a new estate to run. And when a graph genuinely is the answer, it is because of the shape of the query — algorithms, deep traversal, structural learning — not because the industry vertical is labelled fraud or supply chain.',
        bullets: [
          ['Purpose', ['Reframe "we need Neo4j" into "which question fails today, and what shape is it?"']],
          ['Discovery', [
            'What does the word graph mean in your architecture notes or vendor shortlist right now?',
            'Is the priority exploration for people, context for agents, production traversal SLAs, or all three?',
            'Which business unit or workload is pushing this first, and what is their deadline?',
          ]],
        ],
        transition: 'Transition: "Sixty seconds of vocabulary, and the visual will do most of it."'
      });

      NOTES.push({
        title: 'Vocabulary · network and table',
        onscreen: 'Linked dual view: force network beside the edge table, hop controls, clickable rows and nodes.',
        say: 'A graph is two sets — entities and relationships. Degree is how busy a node is. A hop is one edge, and traversal is walking a path. Now the part that carries this entire briefing: the same information is sitting in the table on the right. Subject, predicate, object. Nothing about that requires a new database. When you hear "we need a graph database," what is usually being described is a multi-hop query, and a multi-hop query is a join you have not written yet.',
        bullets: [
          ['Purpose', ['Demystify the vocabulary and plant the edge-table idea before the ladder']],
          ['How to demo live', [
            'Start on Both. Step hops 1, 2, 3 and watch the hop column in the table change with the network',
            'Click a table row — the matching edge lights up in the network',
            'Click a node to reseed, then drag it to show the layout is cosmetic and the data is not',
            'Switch to Table only and say: this is what actually ships',
          ]],
          ['Discovery', [
            'Which business questions are two hops or deeper today, and where do they break?',
            'Are those answered in BI, in ad-hoc SQL, or genuinely not at all?',
          ]],
        ],
        transition: 'Transition: "So where does every engagement actually start?"'
      });

      NOTES.push({
        title: 'Managed path and ladder',
        onscreen: 'Five clickable rungs, and one panel below that redraws on selection — components, four facets, and a planning-range note.',
        say: 'A benchmark query is just one of your own real questions used as the test. Whichever rung answers it is the rung you need, and nothing above it is justified yet. Start on the left. Rung one is not a build — Genie Ontology generates a semantic map from your tables, queries, dashboards, and docs, the Glossary is how you correct it, Metric Views give certified numbers, and Relationships lets you declare entity relationships as a governed asset. Days, because nothing is being built. Everything to the right of it is a build, and the timings say so. Watch the panel as I move across: the components change, and so does the last facet, when it fails. That failure signal is the only thing that should move you up a rung. Not ambition, not a vendor demo. A specific query the rung below cannot answer.',
        bullets: [
          ['Purpose', ['Establish the shared vocabulary for scoping and SME escalation, and set honest expectations on delivery time']],
          ['How to demo live', [
            'Land on rung one first and point out the panel is showing rung one — the label, the components, and the facets all move together',
            'Click across two, three, four, five and let the components redraw each time — the audience should see the stack change, not just the prose',
            'On each click read "When it fails" last, then the delivery range, so the failure signal and the cost of climbing land together',
            'Then ask which rung they believe they are on today, and which one they believe they need',
            'The gap between those two answers is the whole discovery conversation',
          ]],
          ['Key nuance', [
            'The ranges assume the edge data still has to be produced and resolved. If they already have a clean, resolved edge set, the middle rungs compress',
            'Entity resolution is reliably the longest pole. When someone pushes back on the timings, that is almost always the variable being underestimated',
            'Rung one is the only one measured in days because nothing is being built — it is enable and curate',
            'Rung five reads as months because two systems have to be synced, secured, and governed, not because the engine is hard to stand up',
            'These are planning ranges for scoping, not a quote or a commitment — keep them framed that way',
            'Rung five is not a failure state. Existing Cypher estates and formal reasoning requirements are legitimate reasons to be there on day one',
          ]],

            'Which rung do you believe you are on today, and which one do you believe the questions require?',
            'What state is the source data in for the entities you would build edges from — is entity resolution solved, partial, or untouched?',
            'How quickly do you need a POC that answers a real question end to end?',
            'Who owns budget and who owns implementation for phase one?',
            'Do you have ontology or graph expertise on staff, or would that be partner or SME capacity?',
            'What does a security or governance review add to a project like this in your organization?',
          ]],
        ],
        transition: 'Transition: "Before the three sections, one slide that separates them cleanly."'
      });

      NOTES.push({
        title: 'Three semantic layers',
        onscreen: 'Section opener — same oat canvas as the content slides, oversized headline under a full-bleed coral rule. Three hairline-separated columns with mini visuals: taxonomy tree, ontology types with metadata badge, KG with predicate values.',
        say: 'Three words that get used interchangeably and should not be. A taxonomy is a classification tree — mammal, dog, poodle. An ontology is the allowed types, relationship types, and rules, and the important word on that middle card is metadata. It describes meaning. It holds no records. The knowledge graph is the instance layer: real records, and every edge carries an actual predicate value, like Acme owns eighty-two percent of Beta. Those three cards are the next three sections of this deck, in that order, because the work gets heavier as you move right.',
        bullets: [
          ['Purpose', ['Give the room a clean sorting rule they can apply to their own backlog']],
          ['Key nuance', ['RDF and OWL when formal reasoning or interoperability matter; labelled property graphs when application development and analytics are the culture. Regulated industries ask for RDF far more often']],

            'When your team says ontology, do you mean formal validation or curated business terms?',
            'Who owns business definitions today — governance, domain stewards, or nobody clearly?',
          ]],
        ],
        transition: 'Transition: "Start with taxonomy, because it is the simplest of the three to pin down — and where the most avoidable pain lives."'
      });

      NOTES.push({
        title: 'Taxonomy overview',
        onscreen: 'Section opener — same oat canvas as the content slides, oversized headline under a full-bleed coral rule. The product hierarchy with each depth band named root, category, subcategory, leaf category, one edge drawn coral, and a closing band showing where taxonomy sits against the other two layers.',
        say: 'A taxonomy is a classification tree. Every node has exactly one parent, and you read it from the root down: category, subcategory, and then the lowest category, the one products actually hang under. This is the product hierarchy — all products, electronics, computers, laptops — and it is the same tree for the rest of this section. Now look at what that drawing actually is. Twelve nodes, eleven edges, one edge type, and the coral one is doing nothing special — it just says that computers is a child of electronics. So yes, a taxonomy is a graph. It is the simplest graph there is. And that matters mainly because of what it does not imply: nothing on this canvas needs a graph database or a traversal engine. A table holds this perfectly well, and every question anyone will ask of it can be answered in SQL. The decision this section is really about is how you encode the tree in that table, because that is what determines whether an agent writes correct SQL over it or quietly writes wrong SQL. There are several encodings, they are not equivalent, and we compare them on the next two slides.',
        bullets: [
          ['Purpose', ['Define taxonomy plainly, kill the assumption that a tree implies a graph engine, and set up encoding as the only decision that matters here']],

            'How many separate hierarchies are in play — product, org, location, account — and are they all stored the same way?',

            'Are there named sets or business rules that cut across the tree rather than sitting under a single parent?',
            'How does a new level or a re-parent get made today, and what breaks downstream when it does?',
          ]],
        ],
        transition: 'Transition: "So here is the client need, and it starts with a question that comes back empty."'
      });

      NOTES.push({
        title: 'Taxonomy · the client need',
        onscreen: 'One matrix: the four totals the need calls for, against the same stored hierarchy, ordered by how far each total sits above the products, with what came back beside what the right answer was. A small banded reference tree sits under it, showing where each named node lives and how far it is from the product row.',
        say: 'The need here is simple to state. A user should be able to ask for a total at any level of the hierarchy and get it — product, category, department — and they should be able to ask for the named sets the business actually runs on, even when those cut across branches. Four asks, and the only thing that changes down the rows is how far above the products the total sits. Before the rows, look at the small tree underneath. Those are the same bands from the previous slide, and I have added the row the tree does not have nodes for: the products. Revenue lives on that bottom row and nowhere else, so levels to roll up just counts bands from the node in the question down to it. Now the first row is the need already being met. Laptops is one band above the products, the things underneath it are SKU-A and SKU-B, products carry revenue, and the number comes back correct. Climb one rung. Computers is two bands up, and what sits directly underneath it is not products, it is two more categories — and categories have no revenue of their own. No rows. Climb again to Electronics and it is the same story one band deeper. And the last row is the part of the need that is furthest from being met: Strategic Assortment is a business rule, everything under Computers plus everything under Living Room, and no parent_id in this table names that set at all. So the assistant is not bad at arithmetic. It can total anything stored at the level it can see. Every one of these rollups needs a walk up the tree, and the walk is not in the row it is reading. Look at the right-hand column while I say this: the money exists in all four cases. Only one of the four answers does.',
        bullets: [
          ['Purpose', ['State the need as totals at every level plus cross-branch segments, and use the matrix as evidence that today\'s encoding cannot deliver it — before anyone proposes a graph database']],
          ['How to demo live', [
            'Start on the reference tree for ten seconds — point at the product band, then count bands up to Laptops, Computers, Electronics. After that the first column reads itself',
            'Then read the left column down — one, two, three, cross-branch. That is the only variable on the slide',
            'Then read the two right-hand columns as a pair: one real number returned against four real numbers the business needs',
            'The middle column is why the need goes unmet — products carry revenue, categories do not, and this encoding only ever shows one hop',
            'Numbers on the circles are node ids and products are lettered SKUs, so nothing on the tree is ambiguous when you point at it',
            'The line to land: all four queries succeeded. Nothing in the response tells the user the rollup never reached a product',

          ['Key nuance', [
            'This came out of a real customer situation: a hierarchy stored one hop at a time plus semantic rules that did not follow the tree, which forced them to bend Genie instructions until the deeper questions became unanswerable',
            'Across the hierarchy benchmark the model never once wrote a recursive CTE for the rollup, even with a worked example in its instructions',
            'Silent empties are the expensive gap. A wrong number gets challenged in a meeting; a null gets read as "no revenue there"',
            'Strategic Assortment reaches under node 3 Computers and node 11 Living Room. Two subtrees, one set, and that is the shape the segment table on the next slide exists for',
            'Keep this on what they need, not on what is broken — and resist jumping to the fix. The options are the next slide, and SAs who solve it here lose the discovery',
          ]],
          ['Discovery', [
            'What is the assistant getting wrong today, and how did someone notice?',
            'How deep do your hierarchies actually go, and is the depth the same across every branch?',
            'Where is a rollup defined today — in the warehouse, in the BI tool, or in someone\'s head?',
            'Which business terms do your users ask for that are not category names in the tree?',
            'Who owns the hierarchy, and who finds out when it changes?',
          ]],
        ],
        transition: 'Transition: "So the question is how you store it. There are six answers, and they are not equally good for an agent."'

      NOTES.push({
        title: 'Taxonomy · the options',
        onscreen: 'Six clickable storage patterns over a paired view: the numbered product tree on the left, the rows that pattern actually writes on the right.',

            'The node ids are the ids from our own hierarchy benchmark, so the tables are the real encodings a customer would actually see',
            'Products are lettered SKUs on this slide and the two either side of it. A number always means a node, which keeps the segment example from reading as a contradiction',
            'A segment is a union of subtrees, not a filter and not a new level in the tree. If someone asks whether they could just add a category for it, the answer is only when the set is one subtree — which is the Core Home Furniture row',

            'Which of these six tables looks most like what is in your warehouse right now?',
            'If you have more than one hierarchy, are they all stored the same way?',
            'Which of your business rules do not follow the tree — sets that span branches, or that exclude a subtree?',
            'Do those rules live in a table, in BI logic, or only in instruction text?',
            'How often does the hierarchy itself get restructured, and what triggers it?',
          ]],
        ],
        transition: 'Transition: "Here is where we would land, and what the two questions look like once you do."'
      });

      NOTES.push({
        title: 'Taxonomy · the recommendation',
        onscreen: 'Two worked queries, each written as a recursive CTE over adjacency and as a join over closure plus segments, with a measured/cost footnote strip.',
        say: 'Our recommendation is two tables: a closure table for anything that walks the tree, and a segment table for the rules that do not. Take the category question first. On the left, an adjacency list needs a recursive CTE — a seed, a union all, a self-join, and only then the sum. That is correct when it is written correctly, and in our benchmark the adjacency room never once wrote it. On the right, the walk already happened at write time, so everything under Electronics is one equality on ancestor_name. Now switch tabs. The segment question is the interesting one, because the left side has nowhere to put the definition — Strategic Assortment is not a node, so the rule has to travel inside the question every single time. On the right it is a join, and the definition is owned once by whoever owns the segment table. Same shape as the rollup. And I want to be straight about the cost: a closure table is more rows and it has to be maintained whenever the hierarchy is restructured. That trade is worth pricing out loud rather than assuming.',
        bullets: [
          ['Purpose', ['Land closure plus segments as the recommendation, with the cost of it stated in the same breath']],
          ['How to demo live', [
            'Start on the category tab and read the left pane top to bottom so the room hears how many clauses have to be right',
            'Then read the right pane — three lines — and note the only thing that changes for Laptops or All Products is the literal',
            'Press "show the rows this join reads" and tie the ancestor and descendant ids back to the numbered diagram they just saw',
            'Switch to the segment tab and ask where the definition of Strategic Assortment lives on the left. It lives in the prompt',
            'Close on the cost column so the recommendation does not sound free',
          ]],
          ['Key nuance', [
            'Frame the numbers as a controlled benchmark on a small retail hierarchy, not a throughput guarantee. The durable finding is the query shape, not the latency',
            'The sharpest measured result: across seven questions the adjacency room produced zero recursive CTEs despite a worked recursive example sitting in its instructions',
            'Inlining a definition into the question does fix it for flattened, path and closure — but only for the person who already knows the definition. Materializing the set is what makes it reusable',
            'Closure is not the only defensible answer. Materialized path scored the same accuracy and reads well; it just rewrites every descendant row on a rename',
          ]],
          ['Discovery', [
            'How often does the hierarchy change, and is it an edit, a reorganisation, or a full rebuild?',
            'Roughly how many nodes and how many leaves, so we can size what a closure table would actually hold?',
            'If we materialised your named business sets, who would own each definition and approve a change?',
            'Which named sets would make the first list, and how many of them cut across branches?',
            'What would have to be true for you to add a table to the Genie-facing model rather than adding instruction text?',
          ]],
        ],
        transition: 'Transition: "That is taxonomy. Ontology is a different question entirely — it is about meaning."'
      });

      NOTES.push({
        title: 'Ontology overview',
        onscreen: 'Section opener — same oat canvas as the content slides, oversized headline under a full-bleed coral rule. Two-plane diagram that lights up when you switch the agent from tables-only to tables-plus-ontology, beside the answer each version produces.',
        say: 'The most useful thing to understand about an ontology is that it is metadata. Look at the dashed line. Above it: entity types, relationship types, certified definitions. Below it: your rows, which never move — the meaning layer only describes them. Right now the agent is on tables only, so the top plane is barely there, and you can see what that costs on the right. Four candidate churn tables and it picks one. A status column it has to guess the meaning of. The word enterprise with no definition to apply. Watch what happens when I switch it on. Same rows, same warehouse, nothing migrated — but now there is a certified metric for churn, a scored authoritative source, and a governed definition of enterprise. The agent resolves meaning first and writes SQL second. That difference is the entire value of an ontology, and none of it required building a graph.',
        bullets: [
          ['Purpose', ['Land ontology as metadata, and make the payoff visible as a difference in answer quality rather than a definition on a slide']],
          ['How to demo live', [
            'Start on Tables only and let the greyed-out top plane sit there for a beat before saying anything',

        title: 'Operating rule',
        onscreen: 'Nine check rows across two columns: need first, managed first, the metadata boundary, one contract, benchmark before climbing.',
        say: 'If you take one screen away, take this one. Name the need before the technology, lay out the options honestly, and only then recommend — that is the shape we just ran three times. Evaluate the managed stack first. Then the row that saves the most time in a discovery call: separate metadata questions from row-level ones. If the question is what your assets mean, it is an ontology question and it is answered above the line. If it is how one record reaches another, it is a knowledge-graph rung and no amount of curation gets you there. Choose the hierarchy encoding for whoever has to read the SQL, including the model, and materialize named business sets as data rather than prose. Land one edge contract so Genie, explorers, algorithms, and agents all read the same table. Precompute the heavy work. Treat entity resolution as first-class, because deciding two records are the same thing is reliably the hardest part of any real knowledge graph. Keep Delta as the system of record. And climb only when your own queries fail for a reason you can point at.',
        bullets: [
          ['Purpose', ['Leave a reusable checklist and make the escalation criteria explicit']],
          ['SA use', ['This is the list I use to decide whether we stay in product discovery or bring Graph and Ontology SMEs in']],
          ['Discovery', [
            'What would a two-week pilot need to prove for you to expand?',
            'What history, retention, or isolation constraints shape the edge contract?',
            'Can you write down three to five benchmark questions before we schedule anything deeper?',
          ]],
        ],
        transition: 'Transition: "Let\'s sort your actual needs into the three buckets."'
      });

      NOTES.push({
        title: 'Discussion',
        onscreen: 'Proposal plus five numbered open questions.',
        say: 'Sit here. Do not rush it, and use their words rather than ours. The output I want is a short list of questions that must work, each one sorted into taxonomy, ontology, or knowledge graph, with a starting rung and a named owner. That is a scoped next step. A commitment to rung five on the first call is not.',
        bullets: [
          ['Purpose', ['Drive toward a sorted need list, a starting rung, and an escalate-or-not decision']],
          ['Facilitation', [
            'Capture three to five benchmark questions on a whiteboard',
            'Sort each one into taxonomy, ontology, or knowledge graph in front of them',
            'Name owners and one phase-one success criterion',
            'Agree explicitly: stay on the managed or edge path, or schedule an SME deep dive — and why',
          ]],
          ['Discovery', [
            'Which of the on-screen questions is hardest for your team to answer today?',
            'If we start at rung one or two, who owns curation and who owns implementation?',
            'What comparison criteria or procurement timelines are already in motion?',
          ]],
        ],
        transition: 'Transition: "Close on the rule."'
      });

      NOTES.push({
        title: 'Close',
        onscreen: 'Name the need. Then climb.',
        say: 'Pick the questions that matter. Place each one in taxonomy, ontology, or knowledge graph — that decision does most of the scoping for you. Then prove the lowest rung before you leave it. I will help scope that first rung with your team, and bring Graph or Ontology SMEs in the moment the discovery says we need them.',
        bullets: [
          ['Purpose', ['End on the operating rule and a concrete follow-up']],
          ['Ask', ['A working session to list benchmark questions, sort them across the three layers, pick a starting rung, and decide SME escalation']],
        ],
        transition: 'End.'
      });

      /* Section › Subsection per slide, generated from src/outline.py — the same map
         the deck rail is built from. */
      const CRUMBS = [
        ['Overview', 'Opening'],
        ['Overview', 'Opening'],
        ['Overview', 'Framing'],
        ['Overview', 'Framing'],
        ['Overview', 'Framing'],
        ['Overview', 'Framing'],
        ['Taxonomy', 'What it is'],
        ['Taxonomy', 'The hierarchy need'],
        ['Taxonomy', 'The hierarchy need'],
        ['Taxonomy', 'The hierarchy need'],
        ['Ontology', 'What it is'],
        ['Ontology', 'The two needs'],
        ['Ontology', 'The two needs'],
        ['Ontology', 'The two needs'],
        ['Knowledge graphs', 'What it is'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Connecting the dots'],
        ['Knowledge graphs', 'Algorithms'],
        ['Knowledge graphs', 'Algorithms'],
        ['Knowledge graphs', 'Extreme scale'],
        ['Knowledge graphs', 'GNNs'],
        ['Knowledge graphs', 'GNNs'],
        ['Next steps', 'Operating rules'],
        ['Next steps', 'Discussion'],
        ['Next steps', 'Discussion'],
      ];

      const els = {
        title: document.getElementById('title'),
        section: document.getElementById('section'),
        counter: document.getElementById('counter'),
        onscreen: document.getElementById('onscreen'),
        say: document.getElementById('say'),
        bullets: document.getElementById('bullets'),
        transition: document.getElementById('transition'),
      };

      function broadcastSlide(i) {
        try { localStorage.setItem(STORAGE_KEY, String(i)); } catch (_) {}
        if (bc) bc.postMessage({ slideIndex: i, source: 'notes' });
      }

      function render() {
        const note = NOTES[index];
        const n = String(index + 1).padStart(2, '0');
        const total = String(NOTES.length).padStart(2, '0');
        els.title.textContent = note.title;
        els.counter.textContent = `${n} / ${total}`;
        const [section, sub] = CRUMBS[index] || [];
        els.section.innerHTML = section
          ? `<span class="section-tag">${section}<i>›</i>${sub}</span>`
          : '';
        els.onscreen.textContent = note.onscreen;
        els.say.textContent = note.say;
        els.transition.textContent = note.transition;
        els.bullets.innerHTML = (note.bullets || []).map(([heading, items]) => `
          <div class="block">
            <h2>${heading}</h2>
            <ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>
          </div>
        `).join('');
        document.title = `Notes ${n} — ${note.title}`;
      }

      function show(next, opts = {}) {
        index = Math.max(0, Math.min(NOTES.length - 1, next));
        render();
        history.replaceState(null, '', `#${index + 1}`);
        if (!opts.silent && !applyingRemote) broadcastSlide(index);
      }

      function applyRemote(i) {
        if (!Number.isFinite(i) || i === index) return;
        applyingRemote = true;
        show(i, { silent: true });
        applyingRemote = false;
      }

      if (bc) {
        bc.onmessage = (event) => {
          const i = event?.data?.slideIndex;
          if (typeof i === 'number') applyRemote(i);
        };
      }
      window.addEventListener('storage', (event) => {
        if (event.key !== STORAGE_KEY || event.newValue == null) return;
        applyRemote(Number(event.newValue));
      });

      document.getElementById('prev').addEventListener('click', () => show(index - 1));
      document.getElementById('next').addEventListener('click', () => show(index + 1));

      document.addEventListener('keydown', (event) => {
        if (['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp', 'Home', 'End'].includes(event.key)) {
          event.preventDefault();
        }
      });
      document.addEventListener('keyup', (event) => {
        const isStepKey = ['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp'].includes(event.key);
        const now = Date.now();
        if (isStepKey && (event.repeat || now - lastNavAt < 180)) return;
        if (isStepKey) lastNavAt = now;
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) show(index + 1);
        else if (['ArrowLeft', 'PageUp'].includes(event.key)) show(index - 1);
        else if (event.key === 'Home') show(0);
        else if (event.key === 'End') show(NOTES.length - 1);
      });

      let start = Number(location.hash.slice(1)) - 1;
      if (!Number.isFinite(start) || start < 0) {
        try { start = Number(localStorage.getItem(STORAGE_KEY)); } catch (_) { start = 0; }
      }
      show(Number.isFinite(start) && start >= 0 ? start : 0, { silent: true });
      broadcastSlide(index);
    })();
  </script>
</body>
</html>
