        say: 'Three semantic layers hold this together — taxonomy, ontology, knowledge graphs. They are peers, three different answers to what the data means, and each one gets its own beat: what it is, the client needs we actually keep hearing, and how we would answer them. Everything above that middle band is framing — what a graph request usually turns out to be, and about a minute of vocabulary, because the visual does most of that work. Everything below it is what you do about it: three rungs to climb, managed semantics first, then tailored agentic context, then partner-accelerated use cases, and an operating rule that maps a need to a layer and a rung. If you take one thing off this screen, take the middle band.',

        say: 'Three semantic layers are in play, and almost every graph conversation is really about one of them — taxonomy classifies, ontology constrains as metadata, and the knowledge graph instantiates the rows. Once you know which layer the need lives in, the implementation question gets a lot smaller. Graph databases and graph virtualization are both real categories with good vendors in them, and knowledge graphs sit beside them as organizational understanding rendered as interconnected data. In the field, most teams turn out to want relationships their agents can use and a way to explore what connects to what, not a new estate to run. When a graph genuinely is the answer it is because of the shape of the query — algorithms, deep traversal, structural learning — not because the vertical is labelled fraud or supply chain. So we start on the managed semantic stack and test it against questions you already need answered.',

        bullets: [

      NOTES.push({
        title: 'Three semantic layers',
        onscreen: 'Section opener — same oat canvas as the content slides, oversized headline under a full-bleed coral rule. Three hairline-separated columns with mini visuals: taxonomy tree, ontology types with metadata badge, KG with predicate values.',
        say: 'Three words that get used interchangeably and should not be. A taxonomy is a classification tree — mammal, dog, poodle. An ontology is the allowed types, relationship types, and rules, and the important word on that middle card is metadata. It describes meaning. It holds no records. The knowledge graph is the instance layer: real records, and every edge carries an actual predicate value, like Acme owns eighty-two percent of Beta. Those three cards are the next three sections of this deck, in that order, because the work gets heavier as you move right.',

      NOTES.push({
        title: 'Client needs',
        onscreen: 'An index, three bands — taxonomy, ontology, knowledge graph — with the needs under each as hairline rows. Every row is clickable and jumps straight to the slide that states that need.',
        say: 'Every need we actually hear sorts into one of those three layers, and here they all are on one screen. One in taxonomy, two in ontology, four in the knowledge graph. This is a menu, not a summary — read it, tell me which of these is the reason we are in the room, and I will go straight there. Nothing is lost by skipping the rest; the layers are peers.',

      NOTES.push({
        title: 'Taxonomy overview',
        onscreen: 'Section opener — same oat canvas as the content slides, oversized headline under a full-bleed coral rule. The product hierarchy with each depth band named root, category, subcategory, leaf category, one edge drawn coral, and a closing band showing where taxonomy sits against the other two layers.',
        say: 'A taxonomy is a classification tree. Every node has exactly one parent, and you read it from the root down: category, subcategory, and then the lowest category, the one products actually hang under. This is the product hierarchy — all products, electronics, computers, laptops — and it is the same tree for the rest of this section. Now look at what that drawing actually is. Twelve nodes, eleven edges, one edge type, and the coral one is doing nothing special — it just says that computers is a child of electronics. So yes, a taxonomy is a graph. It is the simplest graph there is. And that matters mainly because of what it does not imply: nothing on this canvas needs a graph database or a traversal engine. A table holds this perfectly well, and every question anyone will ask of it can be answered in SQL. The decision this section is really about is how you encode the tree in that table, because that is what determines whether an agent writes correct SQL over it or quietly writes wrong SQL. There are several encodings, they are not equivalent, and we compare them on the next two slides.',

            'Then read the two right-hand columns as a pair: one real number returned against four real numbers the business needs',

      NOTES.push({
        title: 'Taxonomy · the recommendation',
        onscreen: 'Two worked queries, each written as a recursive CTE over adjacency and as a join over closure plus segments, with a measured/cost footnote strip.',
        say: 'Our recommendation is two tables: a closure table for anything that walks the tree, and a segment table for the rules that do not. Take the category question first. On the left, an adjacency list needs a recursive CTE — a seed, a union all, a self-join, and only then the sum. That is correct when it is written correctly, and in our benchmark the adjacency room never once wrote it. On the right, the walk already happened at write time, so everything under Electronics is one equality on ancestor_name. Now switch tabs. The segment question is the interesting one, because the left side has nowhere to put the definition — Strategic Assortment is not a node, so the rule has to travel inside the question every single time. On the right it is a join, and the definition is owned once by whoever owns the segment table. Same shape as the rollup. And I want to be straight about the cost: a closure table is more rows and it has to be maintained whenever the hierarchy is restructured. That trade is worth pricing out loud rather than assuming.',

            'What would have to be true for you to add a table to the Genie-facing model rather than adding instruction text?',

log. It does not read the contents of your rows, and it does not model how one record relates to another. That is not a flaw, it is the scope, and it does double duty: it answers a compliance question and it tells you when to climb. If the question you need answered is shaped like which suppliers sit three hops upstream of this part, nothing on this slide can reach it, and you are in knowledge graph territory. That is the third section.',

        say: 'Three ways to build the graph, and the order down the left is the order to try them. Start at the top, because the first one is the one teams skip. A lot of the relationships you want are already in your warehouse — they are just called join keys instead of edges. Take manufacturing. Supplier, material, product, the sales order, the customer — five tables and four foreign keys, listed down the right. The picture on the left is not something I drew on top of that schema. Every node is a row and every edge is one of those keys; the labels between the columns name which. Note the sales order in the list: it is not a node at all, it is the SOLD_TO edge. And asking which customers are exposed to a given supplier is a four-join query somebody runs today, so follow the red — out of Kesler Metals, through one material, into two products, landing on two of the three customers. That is the query, drawn. Nobody has called it an edge, and turning it into a node table and an edge table is a view, not a project. Let me switch domains, because the shape is the point rather than the example. Banking: customer, account, transaction, counterparty. Network: site, device, circuit, service. Same picture every time — a schema on the right, and on the left the graph it already was. If this is where your relationships live, there is no extraction step at all, and that is genuinely the cheapest graph anybody will ever build you. The limit is real though: this graph can only ever contain relationships somebody already modelled as a key. Second card, and this is the one that answers the question I left open two slides ago. Those four documents became a graph — here is how. One ai_extract call over the corpus, and the important part is the schema you hand it. The predicate is an enum, and that list of strings is exactly the set of edge types your graph is allowed to have. That is a modelling decision wearing a JSON hat. Out come subject, predicate, object rows, they land in the same edge table the first option produces, and the last panel is those four rows as a graph — document, statement, rows, graph, and the graph is only the rows redrawn. Note the bottom row, because I want to be honest about it: the supersession edge — Ray Duval superseded by Maya Okonjo — is not something any single-document pass can produce. It comes from comparing two documents after extraction. You can see it in the graph too: Ray is dimmed and struck through and that edge is coral, the same way we drew him two slides ago, because it is the same fact. Extraction gets you edges; it does not get you every edge. Third card, and I am floating this rather than recommending it. Sometimes a general extractor is not precise enough for the vocabulary. This is a small BERT model fine-tuned on a medical corpus, tagging every token in a physician note — Ibuprofen is a drug, severe gastric issues is a symptom. Ten tokens, two entities. And look at the scores, because this is why I put it on screen rather than describing it: the headline F1 is ninety-two, and Drug is seventy-two. Drug is half the reason you read a physician note. So the honest read is that you buy domain precision and you pay for it twice — a model to fine-tune and host, and an evaluation you have to do per class rather than on the average. And it returns entities, not relationships — which is what the dashed line and the question mark between those two nodes are admitting. Two entities, no edge. Assembling the edges between them is still yours.',
        bullets: [
          ['Purpose', ['Close the gap between the four documents and the graph, and make construction a costed decision with three real options rather than an unexamined ingestion step']],
          ['Key nuance', [
            'The first option is the one to spend time on. Most rooms assume a graph means extraction, and a large share of the relationships they actually want are already foreign keys with a different name',
            'The three domains are there so nobody anchors on supply chain. Switch at least once — the point is that the shape repeats, not that manufacturing is special',
            'The predicate enum on the second card is the real content of that slide. Naming the edge types up front is the modelling decision, and it is the same decision the ontology section was making in a different notation',
            'Say the supersession caveat out loud. Per-document extraction cannot produce an edge that only exists when two documents are compared, and a room that has been sold GraphRAG will not have heard that',
            'The third option is floated, not recommended. It is the answer to "our vocabulary is too specific", and the cost is a model you now own',
            'The Drug F1 of 72 is on the slide deliberately. Publishing the weak class is more credible than publishing the average, and it models the evaluation habit we want the client to have',
            'These three are not exclusive. Real builds use the first for the keyed relationships and the second for what is only in prose, writing into one edge table',
          ]],
          ['How to demo live', [
            'Click all three cards. The rail is the argument — nothing to extract, then extract with SQL, then extract with your own model — and it only lands if they see all three',
            'On the first card, toggle through all three domains and stop talking while you do it. The repetition is what makes the point',
            'Trace the red path with a finger rather than describing it, and hover a row in the schema list if someone asks what a table holds — each one names what a row is',
            'On the second card, put a finger on the enum line before anything else. Then read the bottom row of the triples table, name it as assembled rather than extracted, and move to the same edge in the graph beside it',
            'On the third card, read the four bars bottom to top so Drug comes last. Do not soften it',
          ]],
          ['Discovery', [
            'Pick a relationship you want in the graph — is it a foreign key today, a sentence in a document, or neither?',
            'If we wrote down the list of edge types you want, how long would it be, and who would sign off on it?',
            'Is there vocabulary in your documents that a general model would read straight past?',

      NOTES.push({
        title: 'GraphRAG · the ways to build it',
        onscreen: 'The options stacked down the left, simplest first, under two band labels — the ones that are SQL over Delta, and the two that need an engine. Selecting one draws its mechanism on the right, all five answering the same two-hop question, with that option\'s detail rows underneath. Agent traversal is the first card and carries a callback panel to the taxonomy section.',
        say: 'So that is the graph built. This is the other half — retrieval — and here are the ways to do it, cheapest at the top. These are not the only ways to build GraphRAG, but they are the ones the field has actually run, and the two band labels down the left are the whole argument: the first three are SQL over the same Delta table you already have, and only the last two are an engine you stand up and operate. Every one of them is drawn against the same question — who supplies the subsidiaries of Delta Holdings, two hops — so what changes on the right is the mechanism and nothing else. Start at the top. Agent traversal. Hand the agent the node and edge tables and it walks them the way a person would — a query, look at what came back, a query for the next hop, following the edges out. I want to be precise, because this is usually described wrongly: the agent issues successive queries rather than authoring one clever query up front, and planning around the other picture is where these builds get mis-scoped. We have already worked this exact ground in the taxonomy section — how the hierarchy was encoded is what decided whether a rollup was one join or a walk, and the room that only had an adjacency list never got there. The same lever applies to these edges. And so does the same ceiling. This raises what an agent can pull out of a graph that lives in a normal database, and it stops well short of a real graph problem: branching walks and cycles turn into round trip after round trip, and one hop into a supernode floods the context with far more than the question needed. Where it does work is a DAG or a tree-shaped taxonomy, which is a real and common shape, just not the one people mean when they say graph. Second, pre-materializing the hops. Generate the five, ten, and fifteen hop tables ahead of time and hand them to Genie with the edge table, so multi-hop becomes a join and the volume is bounded by a table you built on purpose. It goes wrong when depth is genuinely open-ended or the hierarchy keeps being restructured underneath you. Third, text to SPARQL to SQL. Structured graph questions compile deterministically down to SQL, and a reviewer can read the query. Notice we are three options in and no engine has appeared yet. Then the two that need one. Graph in Lakebase Postgres — and the name is literal, because Lakebase is managed Postgres: nodes, edges and embeddings in three tables, pgvector for the seed and a bounded recursive walk for the expansion. There is no Cypher and no property-graph engine under it. And a partner database, where the engines are genuinely good and the cost lands on operations rather than on the traversal — two systems to govern and keep in sync.',
        bullets: [
          ['Purpose', ['Lay out the options that have actually been run and make it obvious that most of them never leave SQL and none of them require a graph database by default']],
          ['Key nuance', [
            'The rail gets harder to build top to bottom deliberately. Agent traversal is first because it is the cheapest thing that works, not because it is the recommendation — the recommendation is the next slide',
            'Do not let this become a claim that there are exactly this many ways to build GraphRAG. These are the patterns with mileage behind them, and someone in the room may well have a sixth',
            'Say agent traversal, not recursive SQL. An agent handed the node and edge tables issues successive queries and follows the edges hop by hop — it will not sit down and write a single recursive query, and describing it that way sets an expectation the build will not meet',
            'Plenty of "we need a graph database" asks were true two years ago and are not now. An agent walking the edge table answers more of them than most teams expect it to',
            'Agent traversal is the option most likely to be oversold, including by us. It is a genuine lift on a tree or a DAG and a genuine dead end on a real graph, and the card says both',
            'The taxonomy callback is on the first card because those slides are a long way back by this point. If they joined late, walk back and show the closure table',
            'Partner engines are not the villain. The honest framing is two governed systems, not bad technology — and Delta stays the system of record either way',
            'The virtualized alternative to the Lakebase option sits in the ontology section, so if they push on "we do not want to materialize anything," that is where to take it',
            'Do not sell the Lakebase option as a graph database. The published pattern is relational plus vector primitives in managed Postgres, and it suits bounded k-hop retrieval next to operational data rather than analytics over the whole network. The diagram says so on purpose',
          ]],
          ['How to demo live', [
            'Read the two band labels down the rail before selecting anything — the SQL-versus-engine split is the takeaway even if they remember nothing else',
            'Read the question once, at the first card, and then stop reading it. It does not change, and the point is that only the mechanism beside it does',
            'While the first card is open, say out loud that the agent walks the tables hop by hop rather than writing one query. The recursive SQL on screen is what it attempts, and the amber markers are what the attempt never bounds',
            'On that card, read the fails-when row before the fits-when row. The point of that option is knowing where it stops',
            'Land on the partner card last, so the Neo4j conversation happens with the other four already on the table',
          ]],
          ['Discovery', [
            'How much retrieved data can your agent actually hold, and what does a traversal returning ten thousand rows do to it today?',
            'Who would own the refresh job for hop tables, and how often does your hierarchy get restructured?',
            'If a graph database is already in the plan, what specifically did the SQL path fail to answer?',
            'Are the traversals you care about tree or DAG shaped, or do they loop back on themselves? That answer decides whether agent traversal is a real option here',
          ]],
        ],
        transition: 'Transition: "So here is where we would actually start."'
      });

      NOTES.push({
        title: 'Knowledge graphs · where we land on retrieval',
        onscreen: 'Three steps left to right — agent traversal, Lakebase-native, partner database — each headed by where it sits in the progression, with a line along the floor saying what earns that step.',
        say: 'Here is the recommendation, and it is three steps rather than a menu. Start on the left: hand the Genie agents the node and edge tables and let the agent do the walk. It queries, reads what came back, follows the next edge, and goes again. Nothing to stand up, nothing new to govern, and I want to be blunt that this step answers more retrieval asks than most teams expect it to, which is why it gets a lane of its own rather than being treated as a stepping stone to something better. Step two is Lakebase-native. Text to SPARQL to SQL, or a Postgres graph extension running over Lakebase — real graph semantics and deterministic answers a reviewer can read, still over the same edges, and still nothing to buy. Step three is a partner graph database, Neo4j or one of its neighbours. Those engines are genuinely good; the cost lands on operations, because you are now running and governing two systems and keeping them in sync. And then the rule along the floor of all three, which is the actual argument of the slide: you do not move up because the next step sounds better, you move up because a benchmark query failed on the step you are standing on — came back wrong, or came back too slowly. If nothing has failed, we would be selling you complexity, and I would rather say that here than after it is built. Whichever step you are on, nothing about the edge contract changes, so climbing later is a change of serving path rather than a rebuild.',

      NOTES.push({
        title: 'Knowledge graphs · algorithms',
        onscreen: 'One network on the left and the four algorithm families stacked on the right, selectable. Picking one rearranges and recolours the same graph into what that algorithm computes, and the panel under the cards swaps to what the family is for and the questions it answers.',
        say: 'One network, read four ways, and almost every algorithm request a client brings is one of these four. Who matters — centrality, and watch the graph: the influential nodes pull into the middle and grow, because influence here is a property of position rather than of any column on the row. Who clusters together — community detection, and the same nodes fall apart into three groups the edges make, with the bridges between them the long dark links. How does one entity reach another — pathfinding, where the network straightens into a five-hop route and the route is the entire answer. And who looks alike — similarity, where those two candidates come together around the neighbours they share, and they resemble each other despite never touching. Naming the family is most of the qualification, because the family plus the size is the whole scoping conversation. And I want to be precise about what is not on this slide: none of these four depends on how the computation is run, and none of them requires a graph database. They are all reading an edge table. Which engine executes them is a scale decision rather than an architecture decision, and it is the next slide.',
        bullets: [
          ['Purpose', ['Separate an algorithm requirement from a graph-database requirement, and put the compute choice on a scale axis instead of an architecture debate']],
          ['Key nuance', [

            'Resist naming an engine on this slide even if asked directly. The engines are the next slide and they have their own tradeoffs; answering early collapses two conversations into one',

            'Pathfinding and similarity are where the picture does the most work. Hold on pathfinding long enough to count the hop badges, and on similarity long enough for someone to notice the two candidates have no edge between them',

            'Ask which of the four they came in for. If the answer is more than two, the real requirement is probably exploration rather than a specific algorithm',
          ]],
          ['Discovery', [
            'Which of these four families appears in your benchmark queries, or is the real ask exploration and agent context rather than an algorithm?',

      NOTES.push({
        title: 'Knowledge graphs · running the algorithms',
        onscreen: 'A shared log-scale edge-count axis with the three engine bands, over three columns giving what runs, when it fits, when it fails, and the tradeoff.',
        say: 'The four families were engine-agnostic on purpose, and this is where the engine gets picked. Look at the axis first, because it is the decision: ten thousand edges on the left, a billion on the right, and three bands. NetworkX covers the left third. That is a serverless notebook, no cluster libraries, no GPU — load the edges, run PageRank or Louvain, write the answer back to Delta, and you are done in days. It stops hard, though. Past a few million edges you are out of one machine and there is no distributed path to grow into, so outgrowing NetworkX means rewriting. SparkGraph is the band that spans almost everything, and the reason is that it tiers its own execution: if the graph fits in driver memory it takes a pure-Python fast path, mid-size gets coarsen-then-solve, and past that it goes fully distributed. Same API throughout. So if nobody in the room can tell you how big this graph ends up, that is the one to reach for. And then cuGraph on the right, which is where you go for very large graphs or when a batch job has a real latency target — Louvain over tens of millions of edges, shortest path across a power network. We have run that one. The cost is honest: GPU cluster time and a second runtime somebody maintains. Now the property at the bottom, which matters more than any of the three bands. Because SparkGraph is pure Python on the driver path, the identical package runs inside a model serving endpoint — and Spark does not exist inside a serving endpoint. Which means an agent can compute PageRank in the middle of a conversation instead of looking up a number that was precomputed last night. That is the difference between graph analytics as a report and graph analytics as something an agent reasons with.',
        bullets: [
          ['Purpose', ['Turn the engine question into a size question, and land the one non-obvious property: SparkGraph is the only option that also runs where Spark does not']],
          ['Key nuance', [
            'No engine wins outright and the overlapping bands say so. If asked to pick, the answer is a question back: how many edges, and does anything need it at query time?',
            'The provenance on the SparkGraph serving-endpoint claim is the SMB fraud-ring sub-agent pattern — a "SparkGraph Analyst" agent computing graph metrics mid-conversation. Field-proven, so it can be said plainly',
            'cuGraph is the optional GPU tier of the Lakehouse KG Starter kit, not a separate build. The kit runs on CPU without it, so the GPU decision can be deferred rather than made up front',
            'The durable pattern survives all three: precompute heavy work to Delta, serve cheap lookups. If a client only remembers one line from this section, that is the one worth having',
            'None of these is a graph database, and it is worth saying out loud here — a room that came in believing graph algorithms require Neo4j has now seen three engines that do not',
          ]],
          ['How to demo live', [
            'Trace the axis left to right with a finger before reading any column. The three bands and their overlaps are the argument',

          ]],
          ['Discovery', [

      });

      NOTES.push({

      NOTES.push({
        title: 'Knowledge graphs · GNNs',
        onscreen: 'Two accounts with near-identical feature rows, one dense and one bridging, with layer-one and layer-two aggregation drawn on the graph.',
        say: 'Two accounts. Tenure four years, eighteen thousand in volume over ninety days, same region, three products, no disputes. For any practical purpose the rows are identical, and a model reading only those columns scores them the same — not because it is a bad model, but because there is nothing in front of it to separate them. Now look at where they sit. Account A is inside one dense group where everything it touches already touches everything else. Account B is the only path between two groups that otherwise never meet. Remove A and nothing changes about who can reach whom. Remove B and those two groups have no route to each other at all. A model that aggregates over neighbors separates them cleanly, and the only new information it received is structural. That is the test for whether you reach for a graph neural network: not whether you have a graph, but whether the thing that distinguishes your records is their position in it. The aggregation is what the arrows show — layer one pulls from direct neighbors, layer two from neighbors of neighbors, so after two layers a node encodes the shape of its neighborhood rather than just its own values. So the test for reaching for a graph neural network is not whether you have a graph. It is whether the thing distinguishing your records is their position in it. Hold the cost question for one more slide — this is the most expensive capability in the deck and there are three quite different ways to buy it.',

      NOTES.push({
        title: 'Knowledge graphs · getting structure into a model',
        onscreen: 'Three bands ascending by cost with an effort meter on each — the extension band first, then fine-tuning, then a purpose-built heterogeneous GNN.',
        say: 'The previous slide argued that structure is real signal. This one is about how much you should be willing to spend to use it, and the order is deliberate because both of the options the source actually offers are high complexity. Start at the top band, and note the dashed border, because this one is ours rather than theirs. You already compute centrality and community and embeddings in a batch job. Write them to Delta, add them as columns to the model you already have in production, and see whether the metric moves. No new training stack, no new serving path, and if the answer is that structure adds nothing here, you have found that out for the cost of a batch job instead of two months. The honest limit is real though: one number per node is a summary of a neighborhood, and if the decision genuinely turns on the shape of that neighborhood, you have thrown away the thing a GNN would have used. Middle band is the source\'s first real move: fine-tune a pretrained graph foundation model rather than training one from scratch. On atomistic and scientific work this is very strong, because the physics is shared — somebody already trained on millions of structures and you are adapting it to yours, and coreset training narrows that further by picking the one to ten percent of the data that actually carries the variance. Four to eight weeks. The catch is domain: if your graph is a customer network, there is no pretrained interatomic potential to inherit and this row does not apply to you. Bottom band, and I want to be careful here because it is the longest build in the deck. A purpose-made heterogeneous GNN is worth it where the graph is the decision itself. Our own worked example is partition-skew optimization — schema, runtime telemetry, query history and key distribution across seven node types, feeding a model that tells you the physical layout and which hot keys to salt. That is not a model that helps someone decide; it is the decision. Eight weeks and up, and someone owns that model for years afterwards.',
        bullets: [
          ['Purpose', ['Put the cost order in front of the ambition, so a client who is excited by the previous slide leaves with the cheapest test rather than the biggest project']],
          ['Key nuance', [
            'The top band is flagged as an extension because the source does not offer a rung below fine-tuning. Do not present it as field-proven at the same level as the other two — present it as the obvious first experiment',
            'Both source solutions are complexity High. That is unusual in this deck and it is the reason this slide is ordered by cost rather than by capability',
            'The fine-tuning row is domain-bound, not universally applicable. Pretrained graph foundation models exist for atomistic chemistry; they do not exist for a bank\'s counterparty network. Saying that plainly protects credibility',
            'Coreset selection — embedding then k-means, train on 1 to 10 percent — is worth naming separately. For a client with a data volume problem rather than a modelling problem, that is the interesting half',
            'The partition-skew example is a Databricks-internal use of the technique. It works as proof the pattern is real, and it is a good answer to "has anyone actually done this"',
          ]],

        onscreen: 'One question banner across the top, then the same eight Databricks assets down the left in the same eight positions in both states. The toggle swaps the middle band: without the ontology, numbered round trips out to one asset at a time off a dashed spine, a dead end, a budget cap and four assets dimmed; with it, every asset feeding a pre-built ontology store of ranked snippets, one retrieval arrow down from the question, a permission gate and citations. On the right, the same context window box in both states — nearly full on the crawl, barely touched on the ranked retrieval. Counters under the rail.',
        say: 'Slide ten said an ontology is metadata. This is how the Databricks one actually works, and the whole slide is one axis: is the context built before the question, or crawled after it. Same question both ways — what was enterprise churn last quarter — and the same eight assets down the left. A certified metric view, a certified account table, a draft table, a dashboard, a query, a notebook, a Genie Agent, and a governed glossary page for the word enterprise. Nothing on that list lives outside Databricks, which matters and I will come back to it. Start on the left toggle, without the ontology. An agent has to discover its context at question time, so watch the numbers. One: it name-matches and lands on stg_account_v2, because nothing in the name tells it that is a draft. Two: it follows the relationship to the dashboard built on that table. Three: the query behind the tile. Four: a backtest notebook whose logic no longer applies, and that is a dead end. Every one of those is a round trip, and look at the box on the right — each step is still sitting in the window when the next step runs, so by hop four the window is nearly full. And then the important part, which is what is dimmed. It never reached the certified metric view, it never reached the certified account table, and it never reached the page that defines the word enterprise. The three most authoritative things in the estate, and the crawl ran out of budget before it got to any of them. If that shape looks familiar, it should — it is the same failure we walk through on the agent traversal card later in the deck. Now switch it on. Nothing about the assets changed. What changed is when the work happened. Genie extracts knowledge out of metric views, dashboards, queries, notebooks, pipelines and Genie Agents continuously, on its own schedule, before anybody asks anything — those are the faint lines, and they all fire at once rather than in sequence. What comes out are snippets: metric definitions, authoritative sources, business rules. Those get scored and indexed, and the scoring uses an approach similar to PageRank — it weighs where a definition came from, how much authority its author has, how often people actually rely on it, how tightly it ties to certified and widely-used assets, and how fresh it is. So at question time there is one retrieval against a store that already exists. One round trip, not four. It passes a permission filter on the way out, which is why two people can ask the same question and get two different correct answers — you only ever get back what you could already see in Unity Catalog. And notice what came back first: the glossary page. Where a page defines a concept, that definition beats anything Genie inferred, and the answer cites it. Same window on the right, same budget line, and almost all of it still free. The last thing on the slide is the actionable part. Model the head, let Genie infer the tail. You certify the authoritative table or view and deprecate the drafts, you assign domain membership, you write the glossary pages, and you define metric views so a measure is computed once instead of re-derived every question. Those four levers are exactly what the next slide turns into an order you can start on.',

        say: 'First, the name, since we used it on the options slide without ever unpacking it. This is GraphRAG. That is all the word means — using a graph to serve retrieval — and there is no single product or architecture behind it. The options we walked through are several ways to build one, and what separates them is how they answer the two decisions on this slide. Now the picture. A user asks for everything connected to Delta Holdings. Three entities in the graph match that string, and whatever the walk reaches comes back in full. Those are two decisions, they are independent of each other, and the graph projects I have seen in trouble were treating them as one. Problem one, on the left: which node do we start from. Watch the picture as I move it. Deterministic SQL picks up both written forms of the company we meant — one entity, two surface strings. Switch to vector similarity and a third company arrives, and it is a genuinely different business whose name just sits close in embedding space. Everything hanging off it is now in the answer and none of it belongs there. That is problem one failing. Problem two, on the right, and I want to be precise about what it is, because it is usually described wrongly. The question is not how far we walk. The question is how much comes back and whether the agent can do anything with it. Depth is just the dial. Leave the seed alone and step it. One hop, two hops, and look at the readout in the corner — small, readable, the agent can hold all of it. Three hops and the amber node lights up. That is a shared registered-agent address, an office that thousands of companies use as their registered address. It is a legitimate node, legitimately connected. Take one more hop and everything attached to it comes back with it, and now read the meter: the agent is being handed most of the graph. Every single row of that is true. It is just far more than the question needed, and the model now has to rank it, hold it in context, and reason       const els = {
        title: document.getElementById('title'),
        section: document.getElementById('section'),
        counter: document.getElementById('counter'),
        onscreen: document.getElementById('onscreen'),
        say: document.getElementById('say'),
        bullets: document.getElementById('bullets'),
        transition: document.getElementById('transition'),
      };

      function broadcastSlide(i) {
        try { localStorage.setItem(STORAGE_KEY, String(i)); } catch (_) {}
        if (bc) bc.postMessage({ slideIndex: i, source: 'notes' });
      }

      function render() {
        const note = NOTES[index];
        const n = String(index + 1).padStart(2, '0');
        const total = String(NOTES.length).padStart(2, '0');
        els.title.textContent = note.title;
        els.counter.textContent = `${n} / ${total}`;
        const [section, sub] = CRUMBS[index] || [];
        els.section.innerHTML = section
          ? `<span class="section-tag">${section}<i>›</i>${sub}</span>`
          : '';
        els.onscreen.textContent = note.onscreen;
        els.say.textContent = note.say;
        els.transition.textContent = note.transition;
        els.bullets.innerHTML = (note.bullets || []).map(([heading, items]) => `
          <div class="block">
            <h2>${heading}</h2>
            <ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>
          </div>
        `).join('');
        document.title = `Notes ${n} — ${note.title}`;
      }

      function show(next, opts = {}) {
        index = Math.max(0, Math.min(NOTES.length - 1, next));
        render();
        history.replaceState(null, '', `#${index + 1}`);
        if (!opts.silent && !applyingRemote) broadcastSlide(index);
      }

      function applyRemote(i) {
        if (!Number.isFinite(i) || i === index) return;
        applyingRemote = true;
        show(i, { silent: true });
        applyingRemote = false;
      }

      if (bc) {
        bc.onmessage = (event) => {
          const i = event?.data?.slideIndex;
          if (typeof i === 'number') applyRemote(i);
        };
      }
      window.addEventListener('storage', (event) => {
        if (event.key !== STORAGE_KEY || event.newValue == null) return;
        applyRemote(Number(event.newValue));
      });

      document.getElementById('prev').addEventListener('click', () => show(index - 1));
      document.getElementById('next').addEventListener('click', () => show(index + 1));

      document.addEventListener('keydown', (event) => {
        if (['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp', 'Home', 'End'].includes(event.key)) {
          event.preventDefault();
        }
      });
      document.addEventListener('keyup', (event) => {
        const isStepKey = ['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp'].includes(event.key);
        const now = Date.now();
        if (isStepKey && (event.repeat || now - lastNavAt < 180)) return;
        if (isStepKey) lastNavAt = now;
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) show(index + 1);
        else if (['ArrowLeft', 'PageUp'].includes(event.key)) show(index - 1);
        else if (event.key === 'Home') show(0);
        else if (event.key === 'End') show(NOTES.length - 1);
      });

      let start = Number(location.hash.slice(1)) - 1;
      if (!Number.isFinite(start) || start < 0) {
        try { start = Number(localStorage.getItem(STORAGE_KEY)); } catch (_) { start = 0; }
      }
      show(Number.isFinite(start) && start >= 0 ? start : 0, { silent: true });
      broadcastSlide(index);
    })();
  </script>
